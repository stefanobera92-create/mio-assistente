<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Assistente</title>
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#14110f; --panel:#1d1916; --panel2:#26211d; --line:#3a332d;
    --text:#f3ece4; --muted:#a89a8c; --accent:#e8743b; --accent2:#f2a65a;
    --me:#2c2520; --danger:#e05d5d; --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;color:inherit;cursor:pointer}
  header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:grid;place-items:center;font-weight:800;color:#1a120c}
  header h1{font-size:17px;margin:0;flex:1}
  header small{display:block;color:var(--muted);font-size:12px;font-weight:400}
  .icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;white-space:nowrap}
  .icon-btn:hover{border-color:var(--accent)}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .msg{max-width:min(720px,92%);padding:10px 14px;border-radius:var(--radius);word-wrap:break-word;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--me);border-bottom-right-radius:6px}
  .msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
  .msg.external{align-self:flex-end;background:#1f2a33;border:1px dashed #4b6a80}
  .msg.error{align-self:center;background:transparent;border:1px solid var(--danger);color:var(--danger);font-size:14px}
  .msg .tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .msg p{margin:.4em 0}.msg p:first-child{margin-top:0}.msg p:last-child{margin-bottom:0}
  .msg ul,.msg ol{margin:.4em 0;padding-left:1.3em}
  .msg pre{background:#0e0c0b;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px}
  .msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:#0e0c0b;padding:1px 5px;border-radius:5px}
  .msg pre code{background:none;padding:0}
  .msg h3,.msg h4{margin:.6em 0 .3em;font-size:1em}
  .msg-actions{display:flex;gap:6px;margin-top:6px}
  .msg-actions button{background:none;border:none;color:var(--muted);font-size:12px;padding:2px 4px}
  .msg-actions button:hover{color:var(--accent2)}
  .typing{align-self:flex-start;color:var(--muted);font-size:14px;padding:4px 14px}
  .typing span{animation:blink 1.2s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
  .empty h2{color:var(--text);margin:.3em 0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
  .chip:hover{border-color:var(--accent)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .tools{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}
  .composer{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;
           padding:11px 14px;font:inherit;max-height:180px;min-height:46px}
  textarea:focus{outline:none;border-color:var(--accent)}
  .send{background:var(--accent);border:none;border-radius:14px;width:48px;height:46px;font-size:20px;color:#1a120c;font-weight:700}
  .send:disabled{opacity:.4;cursor:default}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:0;width:min(560px,94vw);max-height:90dvh}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
  .dlg h2{margin:0;font-size:18px}
  .dlg label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  .dlg input,.dlg textarea{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
  .dlg textarea{min-height:90px;max-height:none;resize:vertical}
  .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .btn{border-radius:12px;padding:9px 16px;border:1px solid var(--line);background:var(--panel2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a120c;font-weight:600}
  .btn.danger{color:var(--danger)}
  .hint{font-size:13px;color:var(--muted);margin:0}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);
         padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <div class="logo">A</div>
  <h1 id="botName">Assistente<small>con Claude</small></h1>
  <button class="icon-btn" id="newChatBtn" title="Nuova chat">＋ Nuova</button>
  <button class="icon-btn" id="settingsBtn" title="Impostazioni">⚙︎</button>
</header>

<main id="chat"></main>

<footer>
  <div class="tools">
    <button class="icon-btn" id="reportBtn">📋 Resoconto</button>
    <button class="icon-btn" id="pasteBtn">📥 Incolla da altro bot</button>
  </div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Scrivi un messaggio…"></textarea>
    <button class="send" id="sendBtn" aria-label="Invia">↑</button>
  </div>
</footer>

<!-- Impostazioni -->
<dialog id="settingsDlg">
  <form method="dialog" class="dlg" id="settingsForm">
    <h2>Impostazioni</h2>
    <label>Nome del bot
      <input id="setName" maxlength="40">
    </label>
    <label>Password del bot (la stessa messa su Netlify in BOT_PASSWORD)
      <input id="setPass" type="password" autocomplete="current-password">
    </label>
    <label>Chi sei e come deve comportarsi (istruzioni fisse)
      <textarea id="setSystem" rows="8"></textarea>
    </label>
    <p class="hint">Queste istruzioni e la chat restano solo su questo dispositivo.</p>
    <div class="row">
      <button class="btn danger" value="reset" id="resetDefaults" type="button">Ripristina istruzioni</button>
      <button class="btn" value="cancel">Annulla</button>
      <button class="btn primary" value="save" id="saveSettings">Salva</button>
    </div>
  </form>
</dialog>

<!-- Resoconto -->
<dialog id="reportDlg">
  <form method="dialog" class="dlg">
    <h2>Resoconto per l'altro bot</h2>
    <p class="hint">Copialo e incollalo nella chat di Grok o di Cursor.</p>
    <textarea id="reportText" rows="12"></textarea>
    <div class="row">
      <button class="btn" value="close">Chiudi</button>
      <button class="btn" type="button" id="shareReport">Condividi</button>
      <button class="btn primary" type="button" id="copyReport">Copia</button>
    </div>
  </form>
</dialog>

<!-- Incolla da altro bot -->
<dialog id="pasteDlg">
  <form method="dialog" class="dlg">
    <h2>Incolla la risposta di un altro bot</h2>
    <label>Da quale bot arriva?
      <input id="pasteFrom" value="Grok" maxlength="30">
    </label>
    <label>Testo
      <textarea id="pasteText" rows="10" placeholder="Incolla qui quello che ti ha risposto l'altro bot…"></textarea>
    </label>
    <label>Cosa deve farne il tuo assistente?
      <input id="pasteAsk" value="Leggilo, dimmi cosa ne pensi e integralo con quello che sai già.">
    </label>
    <div class="row">
      <button class="btn" value="cancel">Annulla</button>
      <button class="btn primary" type="button" id="sendPaste">Invia all'assistente</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_SYSTEM = `Ti chiami Sky e sei il mio assistente personale per tutto: lavoro, progetti, idee, organizzazione e domande di ogni giorno.
Rispondi sempre in italiano, in modo diretto e pratico, senza giri di parole.

Chi sono:
- Faccio il pizzaiolo a Corralejo (Fuerteventura, Isole Canarie).
- Sto diventando sviluppatore indie: creo app web con Claude Code, le metto su GitHub e le pubblico su Netlify. Lavoro soprattutto dal tablet.
- Le mie app: Erbario (cura delle piante), app ordini fornitori della pizzeria, dizionario cocktail, ricette dal frigo, AstroSpotter (astrofotografia).
- Obiettivo: mettere da parte 6-8 mesi di risparmi e passare a sviluppare app a tempo pieno.

Quando ti incollo un messaggio di un altro bot (Grok o Cursor), trattalo come il parere di un collega: valutalo con spirito critico, segnala se qualcosa non torna e uniscilo a quello che sai.`;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

let settings = Object.assign({ name:"Sky", password:"", system:DEFAULT_SYSTEM }, store.get("bot.settings", {}));
let messages = store.get("bot.messages", []);   // {role:'user'|'assistant', content, kind?}
let busy = false;

const $ = (id) => document.getElementById(id);
const chat = $("chat"), input = $("input"), sendBtn = $("sendBtn");

/* ---------- Markdown minimale e sicuro ---------- */
function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inline(s){
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent2)">$1</a>');
}
function md(src){
  const parts = esc(src).split(/```[\w-]*\n?([\s\S]*?)```/g);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2) { html += `<pre><code>${part.replace(/\n$/,"")}</code></pre>`; return; }
    const lines = part.split("\n"); let list = null, para = [];
    const flushPara = () => { if (para.length){ html += `<p>${inline(para.join("<br>"))}</p>`; para = []; } };
    const closeList = () => { if (list){ html += `</${list}>`; list = null; } };
    for (const line of lines){
      let m;
      if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { flushPara(); if (list !== "ul"){ closeList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { flushPara(); if (list !== "ol"){ closeList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = line.match(/^#{1,6}\s+(.*)/))) { flushPara(); closeList(); html += `<h4>${inline(m[1])}</h4>`; }
      else if (!line.trim()) { flushPara(); closeList(); }
      else { closeList(); para.push(line); }
    }
    flushPara(); closeList();
  });
  return html;
}

/* ---------- Rendering ---------- */
function render(){
  $("botName").innerHTML = `${esc(settings.name || "Assistente")}<small>con Claude</small>`;
  document.title = settings.name || "Assistente";
  chat.innerHTML = "";
  if (!messages.length){
    chat.innerHTML = `<div class="empty"><h2>Ciao! 👋</h2><p>Sono il tuo assistente. Chiedimi quello che vuoi.</p>
      <div class="chips">
        <button class="chip">Organizzami la settimana tra lavoro e app</button>
        <button class="chip">Idee per vendere le mie app ai locali</button>
        <button class="chip">Quanto mi serve per 6 mesi di runway?</button>
      </div></div>`;
    chat.querySelectorAll(".chip").forEach(c => c.onclick = () => { input.value = c.textContent; send(); });
    return;
  }
  messages.forEach((m, i) => chat.appendChild(bubble(m, i)));
  chat.scrollTop = chat.scrollHeight;
}

function bubble(m, i){
  const el = document.createElement("div");
  const cls = m.kind === "external" ? "external" : m.role;
  el.className = "msg " + cls;
  if (m.kind === "external") el.innerHTML = `<div class="tag">Da ${esc(m.from || "altro bot")}</div>`;
  const body = document.createElement("div");
  body.innerHTML = m.role === "assistant" ? md(m.content) : esc(m.display || m.content).replace(/\n/g,"<br>");
  el.appendChild(body);
  if (m.role === "assistant"){
    const a = document.createElement("div"); a.className = "msg-actions";
    a.innerHTML = `<button>Copia</button>${i === messages.length - 1 ? "<button>Rigenera</button>" : ""}`;
    a.children[0].onclick = () => copy(m.content);
    if (a.children[1]) a.children[1].onclick = regenerate;
    el.appendChild(a);
  }
  return el;
}

function showTyping(on){
  let t = chat.querySelector(".typing");
  if (on && !t){ t = document.createElement("div"); t.className = "typing"; t.innerHTML = "Sto pensando<span>.</span><span>.</span><span>.</span>"; chat.appendChild(t); chat.scrollTop = chat.scrollHeight; }
  if (!on && t) t.remove();
}
function showError(text){
  const e = document.createElement("div"); e.className = "msg error"; e.textContent = text;
  chat.appendChild(e); chat.scrollTop = chat.scrollHeight;
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("Copiato ✓"); }
  catch { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Copiato ✓"); }
}

/* ---------- Chiamata a Claude ---------- */
async function askClaude(msgs, extraSystem = ""){
  const r = await fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-bot-password": settings.password || "" },
    body: JSON.stringify({
      system: settings.system + `\n\nOggi è ${new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}.` + extraSystem,
      messages: msgs.map(m => ({ role: m.role, content: m.content }))
    })
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || `Errore ${r.status}`);
  return data.text;
}

async function run(){
  busy = true; sendBtn.disabled = true; showTyping(true);
  try {
    const text = await askClaude(messages);
    messages.push({ role:"assistant", content:text });
    store.set("bot.messages", messages);
    render();
  } catch (e) {
    showTyping(false);
    showError(e.message + " — tocca ↑ per riprovare.");
  } finally {
    busy = false; sendBtn.disabled = false; showTyping(false);
  }
}

function send(){
  if (busy) return;
  const text = input.value.trim();
  if (!text){
    // riprova se l'ultimo messaggio è dell'utente senza risposta
    if (messages.length && messages[messages.length-1].role === "user") run();
    return;
  }
  messages.push({ role:"user", content:text });
  store.set("bot.messages", messages);
  input.value = ""; autosize(); render(); run();
}

function regenerate(){
  if (busy) return;
  if (messages.length && messages[messages.length-1].role === "assistant"){ messages.pop(); store.set("bot.messages", messages); render(); run(); }
}

/* ---------- Resoconto per altri bot ---------- */
async function makeReport(){
  if (!messages.length){ toast("La chat è vuota"); return; }
  if (busy) return;
  busy = true; showTyping(true);
  try {
    const transcript = messages.map(m => `${m.kind === "external" ? (m.from || "Altro bot") : (m.role === "user" ? "Io" : settings.name)}: ${m.display || m.content}`).join("\n\n");
    const text = await askClaude([{ role:"user", content:
`Ecco una conversazione tra me e te:\n\n"""\n${transcript.slice(-60000)}\n"""\n\nScrivi un RESOCONTO da incollare a un altro assistente AI (Grok o Cursor) che non ha visto questa chat. Formato:
## Contesto
## Cosa abbiamo deciso
## Punti aperti / domande
## Cosa chiedo a te
Sii conciso, in italiano, senza preamboli.` }]);
    $("reportText").value = text;
    $("reportDlg").showModal();
  } catch (e) { showError("Resoconto non riuscito: " + e.message); }
  finally { busy = false; showTyping(false); }
}

/* ---------- Eventi ---------- */
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", autosize);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); send(); } });
sendBtn.onclick = send;

$("newChatBtn").onclick = () => {
  if (messages.length && !confirm("Cancellare la chat attuale e iniziarne una nuova?")) return;
  messages = []; store.set("bot.messages", messages); render();
};

$("settingsBtn").onclick = () => {
  $("setName").value = settings.name; $("setPass").value = settings.password; $("setSystem").value = settings.system;
  $("settingsDlg").showModal();
};
$("resetDefaults").onclick = () => { $("setSystem").value = DEFAULT_SYSTEM; };
$("settingsDlg").addEventListener("close", () => {
  if ($("settingsDlg").returnValue !== "save") return;
  settings = { name: $("setName").value.trim() || "Assistente", password: $("setPass").value, system: $("setSystem").value.trim() || DEFAULT_SYSTEM };
  store.set("bot.settings", settings); render(); toast("Salvato ✓");
});

$("reportBtn").onclick = makeReport;
$("copyReport").onclick = () => copy($("reportText").value);
$("shareReport").onclick = async () => {
  const text = $("reportText").value;
  if (navigator.share) { try { await navigator.share({ text }); } catch {} } else copy(text);
};

$("pasteBtn").onclick = () => { $("pasteText").value = ""; $("pasteDlg").showModal(); };
$("sendPaste").onclick = () => {
  const text = $("pasteText").value.trim(); if (!text) return;
  const from = $("pasteFrom").value.trim() || "altro bot";
  const ask = $("pasteAsk").value.trim();
  messages.push({ role:"user", kind:"external", from, display:text,
    content: `[Messaggio incollato dal bot ${from}]\n"""\n${text}\n"""\n\n${ask}` });
  store.set("bot.messages", messages);
  $("pasteDlg").close(); render(); run();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

render();
if (!settings.password && !store.get("bot.welcomed", false)) {
  store.set("bot.welcomed", true);
  setTimeout(() => $("settingsBtn").click(), 400);
}
</script>
</body>
</html>
